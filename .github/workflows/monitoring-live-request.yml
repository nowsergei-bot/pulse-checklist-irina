name: Publish verified monitoring to working Pulse
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-live-request
  cancel-in-progress: false
jobs:
  request:
    if: github.actor == 'Irikossecure-hub' || github.actor == 'nowsergei-bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Request the sole private working publisher
        env:
          REQUEST_KEY: ${{ secrets.PULSE_MONITORING_REQUEST_KEY }}
          KNOWN_HOSTS: ${{ secrets.PULSE_MONITORING_REQUEST_HOSTS }}
          EDITOR_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/monitoring-request"
          printf '%s\n' "$REQUEST_KEY" > "$RUNNER_TEMP/monitoring-request/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/monitoring-request/hosts"
          ssh -i "$RUNNER_TEMP/monitoring-request/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/monitoring-request/hosts" root@153.76.163.83 "production $EDITOR_SHA $RUN_ID"
